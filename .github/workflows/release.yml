name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.exists.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Makefile
        id: version
        run: echo "version=$(sed -n 's/^VERSION *= *//p' Makefile)" >> "$GITHUB_OUTPUT"

      - name: Skip if release already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Release v$VERSION already exists, bump VERSION in the Makefile to publish a new one"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  deb:
    name: Build .deb
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libpam0g-dev pkg-config dpkg-dev

      - name: Build package
        run: make deb

      - name: Validate package
        run: |
          dpkg-deb --info .output/*.deb
          dpkg-deb --contents .output/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: .output/*.deb
          if-no-files-found: error

  arch:
    name: Build Arch package
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed pam pkgconf

      # makepkg refuses to run as root
      - name: Build package
        run: |
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"
          su builder -c "make -C '$GITHUB_WORKSPACE' arch"

      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: .output/*.pkg.tar.*
          if-no-files-found: error

  release:
    name: Create release
    needs: [version, deb, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
