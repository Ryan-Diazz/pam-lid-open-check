# Configuration file for pam-lid-open-check PAM module
# Location: /etc/pam-lid-open-check.conf

# Enable or disable the lid open check module
# Valid values: true, false
# Default: yes (enabled)
enabled=true

# Example: Disable the module temporarily
# enabled=no

# Enable or disable the lid open check debug mode
# Valid values: true, false
# Default: false (Disabled)
debug=false

# The Reported lid state to the module during debug
# Valid values: closed, open
# Default: closed (assuming you are working on your laptop screen)
debug-state=closed